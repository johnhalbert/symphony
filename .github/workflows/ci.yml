name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_smoke:
        description: Run live Cursor/Linear integration smoke (requires repo secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMPHONY_REAL_SMOKE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: npm run smoke:browser --prefix web
      - run: npm run extension:ci
      - run: npm run extension:typecheck
      - run: npm run extension:test
      - run: npm run extension:build

  real-smoke:
    name: Real integration smoke
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.real_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/real-smoke.test.ts
        env:
          SYMPHONY_REAL_SMOKE: "1"
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PROJECT_SLUG: ${{ secrets.LINEAR_PROJECT_SLUG }}
