toolsets:
  - hermes-cli
agent:
  max_turns: 999
  reasoning_effort: xhigh
  tool_use_enforcement: auto
  disabled_toolsets:
    - tts
    - delegation
compression:
  threshold: 0.75
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ""
security:
  # UNSAFE dogfood debug setting: capture raw tool args/results in transcripts.
  redact_secrets: false
display:
  show_reasoning: true
  tool_progress: verbose
  # UNSAFE dogfood debug setting: store full verbose tool detail text, not tails.
  tool_detail_capture: full
