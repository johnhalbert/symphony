toolsets:
  - hermes-cli
agent:
  max_turns: 999
  reasoning_effort: xhigh
  tool_use_enforcement: auto
  disabled_toolsets:
    - tts
compression:
  threshold: 0.75
delegation:
  max_iterations: 15
memory:
  memory_enabled: false
  user_profile_enabled: false
  provider: ""
display:
  show_reasoning: true
  tool_progress: all
